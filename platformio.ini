; ===========================================================================
;  Reloj de Hyrule · Configuración de PlatformIO (Visual Studio Code)
;  Proyecto de fans SIN ÁNIMO DE LUCRO · No oficial · CC BY-NC-SA 4.0
;  https://github.com/wencescarlos/reloj-hyrule
;
;  Uso en Visual Studio Code:
;    1. Instala la extensión "PlatformIO IDE".
;    2. Abre esta carpeta (la raíz del repositorio).
;    3. Abajo, en la barra de PlatformIO:  ✓ = compilar   → = subir   🔌 = monitor
;
;  Entornos:
;    d1_mini       subir por el cable USB (la primera vez, obligatorio)
;    d1_mini_wifi  subir por WiFi al reloj ya instalado (reloj-hyrule.local)
; ===========================================================================

[platformio]
src_dir = firmware/RelojHyrule
default_envs = d1_mini

[env]
platform = espressif8266@^4.2.0       ; núcleo Arduino ESP8266 3.1.x
board = d1_mini
framework = arduino
board_build.f_cpu = 80000000L
board_build.ldscript = eagle.flash.4m1m.ld   ; 4 MB: 1 MB de archivos + actualizaciones OTA
board_build.filesystem = littlefs
build_flags = -Wall
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder, time

[env:d1_mini]
upload_speed = 921600

[env:d1_mini_wifi]
upload_protocol = espota
upload_port = reloj-hyrule.local      ; o la IP del reloj
upload_flags =
    --auth=hyrule                     ; tu clave de administrador (de fábrica: hyrule)
