<line x1="635.0" y1="158" x2="665.0" y2="158" stroke="#333" stroke-width="1.2" marker-start="url(#fl)" marker-end="url(#fl)"/>
<text x="650.0" y="152.0" text-anchor="middle" font-size="12" fill="#222">barra 3</text>
<text x="420" y="505" font-size="12.5" fill="#33443a">La barra se atornilla firme sobre la torreta, siempre a la misma altura.</text>
<text x="420" y="523" font-size="12.5" fill="#33443a">Las lengüetas se doblan lo necesario: valen para matrices de 9 a 14,5 mm.</text>
<text x="420" y="541" font-size="12.5" fill="#33443a">Aprieta los tornillos hasta el fondo: no hay que medir ni ajustar nada.</text>
<text x="60" y="590" font-size="16" font-weight="700" fill="#1d3b2a">③ Dónde va cada tornillo (vista trasera)</text>
