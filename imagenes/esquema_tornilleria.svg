<text x="500.0" y="42.0" font-size="24" fill="#1d3b2a" text-anchor="middle" font-weight="700">▲ Reloj de Hyrule · Esquema de tornillería (carcasa v2.4)</text>
<text x="500.0" y="68.0" font-size="14" fill="#5b6b5f" text-anchor="middle" font-weight="400">Los 10 tornillos son iguales: <tspan font-weight="700">M3 × 6 autorroscante, cabeza avellanada allen</tspan> (dk 6,5 · k 2,1 · llave de 2 mm), acero inoxidable</text>
