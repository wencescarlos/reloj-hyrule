<text x="159.75" y="122" font-size="12" fill="#222">cabeza a ras · Ø6,5</text>
<text x="60" y="358.0" font-size="12.5" fill="#33443a">El tornillo M3 × 8 atraviesa 1,7 mm de tapa y rosca</text>
<text x="60" y="376.0" font-size="12.5" fill="#33443a">los 5,7 mm del inserto. La cabeza queda encajada.</text>
<text x="420" y="98" font-size="16" font-weight="700" fill="#1d3b2a">② Barras de la matriz (4 tornillos), corte lateral</text>
