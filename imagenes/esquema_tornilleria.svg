<text x="490" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#1d3b2a">▲ Reloj de Hyrule · Esquema de tornillería</text>
<text x="490" y="64" text-anchor="middle" font-size="14" fill="#5b6b5f">Todos los tornillos son iguales: <tspan font-weight="700">8 × M3 × 8 DIN 912</tspan> (allen, cabeza cilíndrica) + <tspan font-weight="700">8 insertos térmicos M3</tspan> (5,7 mm, Ø4,6)</text>
<text x="60" y="98" font-size="16" font-weight="700" fill="#1d3b2a">① Tapa trasera (4 tornillos)</text>
