<text x="500.0" y="720.0" font-size="13.5" fill="#1d3b2a" text-anchor="middle" font-weight="700">Compra: 10 tornillos M3 × 6 autorroscantes de cabeza avellanada allen, inox (mejor 12 por si se pierde alguno). Llave allen de 2 mm.</text>
<text x="500.0" y="742.0" font-size="12.5" fill="#5b6b5f" text-anchor="middle" font-weight="400">Aprieta con suavidad: el tornillo talla su propia rosca en el plástico. Si lo quitas y lo vuelves a poner, gíralo primero hacia atrás hasta notar el «clic» de la rosca.</text>
