<text x="40" y="558" font-size="12.5" fill="#33443a">• Todo se alimenta por el USB del D1 mini (5 V). Con brillo bajo consume poco.</text>
<text x="40" y="576" font-size="12.5" fill="#33443a">• Conecta la ENTRADA de la matriz (IN), no la salida (OUT).</text>
<text x="40" y="594" font-size="12.5" fill="#33443a">• Si las letras salen giradas: página del reloj → Pantalla → giro / orden.</text>
