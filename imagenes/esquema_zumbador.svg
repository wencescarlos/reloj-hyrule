<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600" font-family="Helvetica, Arial, sans-serif">
<rect width="980" height="600" rx="16" fill="#fbf8ef"/>
<text x="490.0" y="40" font-size="24" font-weight="700" fill="#1d3b2a" text-anchor="middle">▲ Reloj de Hyrule · Conexión del zumbador (opcional)</text>
<text x="490.0" y="64" font-size="14" font-weight="400" fill="#5b6b5f" text-anchor="middle">Zumbador PASIVO de 12 mm (como el «speaker» de las placas base). Se coloca en el aro de dentro de la tapa, detrás de una rejilla.</text>
<text x="60" y="110" font-size="16" font-weight="700" fill="#1d3b2a" text-anchor="start">A · Zumbador piezo (el polímetro no marca)</text>
