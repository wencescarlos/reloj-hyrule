<text x="886" y="222" font-size="11" font-weight="400" fill="#5b6b5f" text-anchor="start">(raya a 5V)</text>
<circle cx="808" cy="160" r="4" fill="#333"/>
<circle cx="808" cy="252" r="4" fill="#333"/>
<polyline points="808,318 808,350 650,350 650,226 624,226" fill="none" stroke="#222" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="624,262 635,262 635,372 940,372 940,160 870,160" fill="none" stroke="#d62828" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="500" y="405" font-size="13" font-weight="400" fill="#222" text-anchor="start">El transistor da la corriente que el Wemos no puede dar.</text>
<text x="500" y="425" font-size="13" font-weight="400" fill="#222" text-anchor="start">El diodo protege el transistor de la bobina del zumbador.</text>
<text x="60" y="470" font-size="13.5" font-weight="700" fill="#1d3b2a" text-anchor="start">Cómo saber cuál tienes: mide entre sus dos cables con el polímetro en Ω. Si marca 16–42 Ω es magnético (B); si no marca nada, es piezo (A).</text>
<text x="60" y="494" font-size="13.5" font-weight="400" fill="#33443a" text-anchor="start">Pata del zumbador: D1 (se puede cambiar en Ajustes → Sonido). Activa «Zumbador conectado», guarda y prueba una melodía.</text>
<text x="60" y="518" font-size="13.5" font-weight="400" fill="#33443a" text-anchor="start">El conector negro de 4 huecos no encaja en el Wemos: córtalo o usa cables dupont.</text>
<text x="60" y="542" font-size="13.5" font-weight="400" fill="#33443a" text-anchor="start">Volumen: se regula desde la página (1–10). Si con el 10 suena flojo, usa el montaje B aunque sea piezo.</text>
</svg>