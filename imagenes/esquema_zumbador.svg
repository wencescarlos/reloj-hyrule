<text x="60" y="345" font-size="13" font-weight="400" fill="#222" text-anchor="start">Directo al Wemos con una resistencia de 100 Ω.</text>
<text x="60" y="365" font-size="13" font-weight="400" fill="#222" text-anchor="start">Suena algo más flojo, pero no necesita nada más.</text>
<text x="500" y="110" font-size="16" font-weight="700" fill="#1d3b2a" text-anchor="start">B · Zumbador magnético (16–42 Ω): el de placa base</text>
