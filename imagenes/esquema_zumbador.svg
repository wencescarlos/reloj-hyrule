<text x="600" y="195" font-size="13" font-weight="700" fill="#fff" text-anchor="end">D1</text>
<rect x="608" y="218" width="16" height="16" rx="3" fill="#e8c04a" stroke="#7a5b16"/>
<text x="600" y="231" font-size="13" font-weight="700" fill="#fff" text-anchor="end">G</text>
